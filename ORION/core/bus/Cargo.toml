[package]
name = "orion-bus"
version = "0.1.0"
edition = "2021"
description = "ORION message bus: NATS + gRPC, pub/sub + RPC"

[dependencies]
# Use orion-core types only (not the full crate to avoid cycles)
async-nats = "0.33"
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures-util = "0.3"
async-stream = "0.3"

[build-dependencies]
tonic-build = { workspace = true }