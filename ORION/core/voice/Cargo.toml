[package]
name = "orion-voice"
version = "0.1.0"
edition = "2021"
description = "ORION voice pipeline: wake word, VAD, STT (whisper.cpp), TTS (piper/kokoro)"

[features]
default = ["voice-binary"]
voice-binary = []

[dependencies]
orion-types = { path = "../types" }
tokio = { version = "1.40", features = ["full", "process", "io-std"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
anyhow = "1.0"
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
dirs = "5.0"
which = "6.0"