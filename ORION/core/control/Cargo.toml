[package]
name = "orion-control"
version = "0.1.0"
edition = "2021"
description = "ORION computer control: CUA driver, X11/Wayland, accessibility, OCR"

[features]
default = []

[dependencies]
orion-types = { path = "../types" }
# cua-driver = { version = "0.1", optional = true, features = [] }  # Not on crates.io
ash = "0.38"
wayland-client = "0.31"
wayland-protocols = "0.31"
x11rb = "0.11"
accesskit = "0.12"
# tesseract = "0.2"  # Conflicts with whisper-rs via clang-sys
image = "0.25"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"